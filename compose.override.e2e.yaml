services:
  e2e-test-runner:
    build: ./e2e
    environment:
      - DIFFICALCY_HOST=difficalcy:80
      - DIFFICALCY_SLIM_HOST=difficalcy-slim:80
    depends_on:
      - difficalcy
      - difficalcy-slim

  beatmap-server:
    image: caddy:2-alpine
    volumes:
      - ./e2e/beatmaps:/usr/share/caddy:ro

  difficalcy:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - BEATMAP_DOWNLOAD_URL=http://beatmap-server:80/{beatmapId}.osu
    depends_on:
      - beatmap-server

  difficalcy-slim:
    build:
      context: .
      target: publish-slim
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - BEATMAP_DOWNLOAD_URL=http://beatmap-server:80/{beatmapId}.osu
    depends_on:
      - beatmap-server
      - cache
