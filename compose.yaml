services:
  difficalcy:
    build:
      context: .
      target: publish
    environment:
      - REDIS_CONFIGURATION=cache:6379
    volumes:
      - beatmaps:/beatmaps
    depends_on:
      - cache

  cache:
    image: redis:8
    volumes:
      - redis-data:/data

  docs:
    build: ./docs
    volumes:
      - ./docs:/docs

volumes:
  beatmaps:
  redis-data:
